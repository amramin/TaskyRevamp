# =========================================
# Azure DevOps pipeline for TaskyRevamp API
# Builds with .NET 9 SDK and deploys to IIS
# =========================================

trigger:
  branches:
    include: [ main ]
pr: none

variables:
  buildConfiguration: 'Release'
  solution: 'TaskyRevamp.sln'
  project_api: 'TaskyRevamp.WebAPI\TaskyRevamp.WebAPI.csproj'

stages:
  # ================== CI: Build & Publish ==================
  - stage: Build
    displayName: Build & Publish
    jobs:
      - job: Build
        displayName: Build on hosted agent
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Use .NET 9 SDK
            inputs:
              packageType: 'sdk'
              version: '9.x'

          - script: |
              echo Repo root: $(Build.SourcesDirectory)
              dir /b $(Build.SourcesDirectory)
              dir /b /s $(Build.SourcesDirectory)\*.sln
              dir /b /s $(Build.SourcesDirectory)\*.csproj
            displayName: List .sln and .csproj files

          - script: dotnet restore "$(solution)"
            displayName: dotnet restore
            workingDirectory: $(Build.SourcesDirectory)

          - script: dotnet build "$(solution)" -c $(buildConfiguration) --no-restore
            displayName: dotnet build
            workingDirectory: $(Build.SourcesDirectory)

          - script: dotnet publish "$(project_api)" -c $(buildConfiguration) -o "$(Build.ArtifactStagingDirectory)\publish\api"
            displayName: dotnet publish (API)
            workingDirectory: $(Build.SourcesDirectory)

          - task: PublishBuildArtifacts@1
            displayName: Publish artifact
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)\publish'
              ArtifactName: 'drop'
              publishLocation: 'Container'
  
  # ================== CD: Deploy to IIS (self-hosted) ==================
  - stage: Deploy
    displayName: Deploy to IIS
    dependsOn: Build
    jobs:
      - deployment: IIS
        displayName: Deploy API on IIS Server
        environment: 'prod'                 # Ensure an Environment named 'prod' exists
        pool:
          name: 'SelfHosted-Windows-IIS'    # your agent POOL
          # demands:
          # - Agent.Name -equals IIS-01     # (optional) pin to that agent
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - powershell: |
                    $ErrorActionPreference = 'Stop'
                    
                    $src      = "$(Pipeline.Workspace)\drop\api"
                    $siteRoot = "C:\inetpub\wwwroot\TaskRevampPipelines\API"
                    $sitePath = Join-Path $siteRoot "current"
                    $appPool  = "TaskyRevampPipelineAPI"
                    
                    if (-not (Test-Path $src))      { throw "Publish folder not found: $src" }
                    if (-not (Test-Path $sitePath)) { throw "IIS site path not found: $sitePath" }
                    
                    Write-Host "Putting app offline..."
                    $offline = Join-Path $sitePath 'app_offline.htm'
                    Set-Content -Path $offline -Value 'Updating...'
                    
                    Write-Host "Mirroring files to $sitePath ..."
                    # Exclude app_offline.htm so it stays until we explicitly remove it:
                    robocopy $src $sitePath /MIR /XF app_offline.htm /NFL /NDL /NP /R:3 /W:3
                    $rc = $LASTEXITCODE
                    if ($rc -ge 8) { throw "Robocopy failed with code $rc" }
                    $global:LASTEXITCODE = 0  # prevent non-zero bubbling from robocopy
                    
                    # Try to recycle the app pool (WebAdministration -> appcmd fallback)
                    $recycled = $false
                    try {
                      Import-Module WebAdministration -ErrorAction Stop
                      if (Test-Path "IIS:\AppPools\$appPool") {
                        Write-Host "Recycling app pool via WebAdministration: $appPool"
                        Restart-WebAppPool -Name $appPool
                        $recycled = $true
                      } else {
                        Write-Warning "AppPool not found at IIS:\AppPools\$appPool"
                      }
                    } catch {
                      Write-Warning "WebAdministration recycle failed: $($_.Exception.Message)"
                    }
                    
                    if (-not $recycled) {
                      try {
                        $appcmd = Join-Path $env:WINDIR "System32\inetsrv\appcmd.exe"
                        if (Test-Path $appcmd) {
                          Write-Host "Recycling app pool via appcmd: $appPool"
                          & $appcmd recycle apppool /apppool.name:$appPool
                          if ($LASTEXITCODE -eq 0) { $recycled = $true }
                          $global:LASTEXITCODE = 0
                        } else {
                          Write-Warning "appcmd.exe not found."
                        }
                      } catch {
                        Write-Warning "appcmd recycle failed: $($_.Exception.Message)"
                      }
                    }
                    
                    Write-Host "Bringing app online..."
                    Remove-Item $offline -Force -ErrorAction SilentlyContinue
                    
                    if (-not $recycled) {
                      Write-Warning "App pool recycle could not be verified. The app should still restart due to app_offline removal."
                    }
                    
                    # Force success exit to avoid residual non-zero codes
                    exit 0
                  displayName: Copy files to IIS & recycle app pool
