# =========================================
# Azure DevOps pipeline for TaskyRevamp API
# Builds with .NET 9 SDK and deploys to IIS
# =========================================

trigger:
  branches:
    include: [ main ]
pr: none

variables:
  buildConfiguration: 'Release'
  solution: '**/TaskyRevamp.sln'
  project_api: '**/TaskyRevamp.WebAPI.csproj'

stages:
  # ================== CI: Build & Publish ==================
  - stage: Build
    displayName: Build & Publish
    jobs:
      - job: Build
        displayName: Build on hosted agent
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Use .NET 9 SDK
            inputs:
              packageType: 'sdk'
              version: '9.x'

          - script: |
              echo Repo root: $(Build.SourcesDirectory)
              dir /b /s $(Build.SourcesDirectory)\*.sln
              dir /b /s $(Build.SourcesDirectory)\*.csproj
            displayName: List .sln and .csproj files

          - script: dotnet restore "$(solution)"
            displayName: dotnet restore

          - script: dotnet build "$(solution)" -c $(buildConfiguration) --no-restore
            displayName: dotnet build

          - script: dotnet publish "$(project_api)" -c $(buildConfiguration) -o "$(Build.ArtifactStagingDirectory)\publish\api"
            displayName: dotnet publish (API)

          - task: PublishBuildArtifacts@1
            displayName: Publish artifact
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)\publish'
              ArtifactName: 'drop'
              publishLocation: 'Container'
  
  # ================== CD: Deploy to IIS (self-hosted) ==================
  - stage: Deploy
    displayName: Deploy to IIS
    dependsOn: Build
    jobs:
      - deployment: IIS
        displayName: Deploy API on IIS Server
        environment: 'prod'                 # <-- REQUIRED: create an Environment named 'prod'
        pool:
          name: 'SelfHosted-Windows-IIS'    # your agent POOL
          # demands:
          # - Agent.Name -equals IIS-01     # (optional) pin to that agent
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - powershell: |
                    $ErrorActionPreference = 'Stop'
                    
                    $src      = "$(Pipeline.Workspace)\drop\api"
                    $siteRoot = "C:\inetpub\wwwroot\TaskRevampPipelines\API"
                    $sitePath = Join-Path $siteRoot "current"
                    $appPool  = "TaskyRevampPipelineAPI"
                    
                    if (-not (Test-Path $src))      { throw "Publish folder not found: $src" }
                    if (-not (Test-Path $sitePath)) { throw "IIS site path not found: $sitePath" }
                    
                    Write-Host "Putting app offline..."
                    Set-Content -Path (Join-Path $sitePath 'app_offline.htm') -Value 'Updating...'
                    
                    Write-Host "Mirroring files to $sitePath ..."
                    robocopy $src $sitePath /MIR /NFL /NDL /NP /R:3 /W:3
                    if ($LASTEXITCODE -ge 8) { throw "Robocopy failed with code $LASTEXITCODE" }
                    
                    Write-Host "Recycling app pool $appPool ..."
                    Import-Module WebAdministration
                    if (Test-Path IIS:\AppPools\$appPool) {
                      Restart-WebAppPool -Name $appPool
                    } else {
                      Write-Warning "AppPool not found: $appPool"
                    }
                    
                    Write-Host "Bringing app online..."
                    Remove-Item (Join-Path $sitePath 'app_offline.htm') -Force -ErrorAction SilentlyContinue
                  displayName: Copy files to IIS & recycle app pool
